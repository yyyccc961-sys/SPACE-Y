<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SPACE | المعرض</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="admin.js"></script></head>
<body class="admin-page" data-page="portfolio">
<div class="admin-shell"><main id="page" class="hidden">
<header class="admin-header"><a class="brand" href="index.html"><span class="brand-mark">Y</span><span>SPACE<small>ADMIN CONSOLE</small></span></a><div><h1>المعرض</h1><p>ارفع صور وفيديوهات أعمالك.</p></div><button id="logoutBtn" class="btn-small">تسجيل الخروج</button></header>
<nav class="admin-tabs" id="adminNav"></nav>
<div class="admin-grid"><article class="admin-card"><h2>إضافة عمل للمعرض</h2><form id="portfolioForm"><label>عنوان العمل<input name="title" required maxlength="120"></label><label>وصف العمل<textarea name="description" maxlength="1000"></textarea></label><label>اختيار صورة أو فيديو من جهازك<input name="media_file" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" required></label><small class="muted">يرفع الملف إلى مساحة تخزين Supabase المسماة space-media.</small><label>نوع الوسائط<select name="media_type"><option value="image">صورة</option><option value="video">فيديو</option></select></label><button class="button button-light" type="submit">إضافة العمل +</button><p class="status" id="portfolioStatus"></p></form></article>
<article class="admin-card"><h2>الأعمال الحالية</h2><div id="portfolioList" class="admin-list"></div></article></div>
</main></div></body></html>
