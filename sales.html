<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>SPACE | الحسابات والإيرادات</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="admin.js"></script></head>
<body class="admin-page" data-page="sales">
<div class="admin-shell"><main id="page" class="hidden">
<header class="admin-header"><a class="brand" href="index.html"><span class="brand-mark">Y</span><span>SPACE<small>ADMIN CONSOLE</small></span></a><div><h1>الحسابات والإيرادات</h1><p>سجّل المبيعات وتابع المبالغ المستلمة.</p></div><button id="logoutBtn" class="btn-small">تسجيل الخروج</button></header>
<nav class="admin-tabs" id="adminNav"></nav>
<div class="admin-grid"><article class="admin-card"><h2>تسجيل عملية بيع</h2><form id="saleForm"><label>اسم العميل (اختياري)<input name="customer_name" maxlength="120"></label><label>الخدمة أو المشروع<input name="item_name" required maxlength="160"></label><label>قيمة البيع بالدينار العراقي<input name="amount" type="number" min="1" step="1" required></label><label>حالة الدفع<select name="payment_status"><option value="paid">مدفوع بالكامل</option><option value="pending">غير مدفوع</option><option value="partial">مدفوع جزئياً</option></select></label><label>المبلغ المستلم بالدينار العراقي<input name="amount_received" type="number" min="0" step="1" value="0" required></label><label>تاريخ البيع<input name="sale_date" type="date" required></label><label>ملاحظات<textarea name="notes" maxlength="1000"></textarea></label><button class="button button-light" type="submit">حفظ عملية البيع +</button><p class="status" id="saleStatus"></p></form></article>
<article class="admin-card"><h2>سجل المبيعات</h2><div id="salesList" class="admin-list"></div><p class="status" id="salesStatus"></p></article></div>
</main></div></body></html>
